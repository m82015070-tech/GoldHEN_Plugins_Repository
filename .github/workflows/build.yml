name: Build plugin

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld make

      - name: Get OpenOrbis toolchain
        run: |
          curl -L -o oo.tar.gz https://github.com/StevenMiller123/OpenOrbis-PS4-Toolchain/releases/latest/download/openorbis_toolchain.tar.gz
          mkdir oo && tar -xzf oo.tar.gz -C oo
          echo "OO_PS4_TOOLCHAIN=$(find $PWD/oo -maxdepth 3 -type d -name PS4Toolchain | head -n1)" >> $GITHUB_ENV

      - name: Build GoldHEN SDK
        run: |
          git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK
          cd GoldHEN_Plugins_SDK && make
          echo "GOLDHEN_SDK=$PWD" >> $GITHUB_ENV

      - name: Build plugins
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: bin/plugins/**
